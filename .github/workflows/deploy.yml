name: Deploy to Cloudflare Workers

on:
  repository_dispatch:
  push:
    branches: ['master']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm build

      # Every deploy re-uploads both tokens from this repo's secrets. Fail
      # rather than deploy a Worker with a token missing, or with one value
      # serving as both, which would let every reader write.
      - name: Check both cache tokens are set
        env:
          TURBO_READ_TOKEN: ${{ secrets.TURBO_READ_TOKEN }}
          TURBO_WRITE_TOKEN: ${{ secrets.TURBO_WRITE_TOKEN }}
        run: |
          if [ -z "$TURBO_READ_TOKEN" ] || [ -z "$TURBO_WRITE_TOKEN" ]; then
            echo "::error::Set the TURBO_READ_TOKEN and TURBO_WRITE_TOKEN repository secrets before deploying."
            exit 1
          fi
          if [ "$TURBO_READ_TOKEN" = "$TURBO_WRITE_TOKEN" ]; then
            echo "::error::TURBO_READ_TOKEN and TURBO_WRITE_TOKEN must differ, or every reader can write."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          TURBO_READ_TOKEN: ${{ secrets.TURBO_READ_TOKEN }}
          TURBO_WRITE_TOKEN: ${{ secrets.TURBO_WRITE_TOKEN }}
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: 'pnpm'
          preCommands: |
            echo "*** post commands ***"
            wrangler r2 bucket create turborepo-cache || true
            echo "******"
          secrets: |
            TURBO_READ_TOKEN
            TURBO_WRITE_TOKEN
          command: deploy
